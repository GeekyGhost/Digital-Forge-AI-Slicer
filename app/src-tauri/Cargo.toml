[package]
name = "digital-forge-3d-slicer"
version = "0.2.0"
description = "Digital Forge 3D Slicer"
authors = ["GrayGuard Forge"]
edition = "2021"

[lib]
name = "dforge_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
tauri-plugin-dialog = "~2.7"
tauri-plugin-opener = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
